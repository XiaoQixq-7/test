<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>TYB新闻网</title>
		<style>
		h1 {
			    font-size: 80px;  /* 超大字体！想更大改100px，更小改60px */
			    color: yellow;    /* 标题黄色，更醒目 */
			    margin: 20px 0;   /* 留一点间距 */
		    }
		.square
		{
			background-color:  blue;
			width:  1000px;
			height:  30px;
			margin-left:  0%;
			display: flex;          /* 启用Flex布局 */
			justify-content: space-around; /* 文字均匀分布（两端也留空隙） */
			    /* 或用 justify-content: space-between; 文字紧贴两端 */
			align-items: center; 
		}
		</style>
	</head>
	<body>
		<Font color=white>
		<div class="square">
		    <span>来只惠</span>
		    <span>裁切</span>
		    <span>行政区</span>
		    <span>只需要</span>
		    <span>躲猫猫</span>
		    <span>给客户</span>
		    <span>谢谢</span>
		    <span>做生意</span>
		    <span>初高中</span>
		    <span>拆迁户</span>
		</div>
	</body>
</html>
